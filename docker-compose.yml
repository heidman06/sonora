services:
  sonora:
    build: .
    image: sonora:local
    container_name: sonora
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3011"
    environment:
      SONORA_HOST: 0.0.0.0
      SONORA_PORT: "3011"
      SONORA_DATA: /data
      SONORA_NODE_BIN: /usr/local/bin/node
      YTDLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: /usr/bin/ffmpeg
      PIPED_URL: ${PIPED_URL:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3011/api/mus/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
